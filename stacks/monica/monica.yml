version: '3.8'
services:
  app:
    image: monica
    ports:
      - 8085:80
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
    volumes:
      - data:/var/www/html/storage
    restart: always

volumes:
  data:
    name: data
    external: true